<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ส่งข้อความเข้ากล่องจดหมาย</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--gold:#fbbf24;--ok:#10b981;--err:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding:16px;max-width:480px;margin-inline:auto}
  h1{font-size:18px;color:var(--gold);margin:4px 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
  label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
  input,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#0b1220;color:var(--txt);font-size:15px;font-family:inherit}
  textarea{min-height:110px;resize:vertical}
  button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer}
  .primary{background:var(--gold);color:#1e1b0b;width:100%}
  .ghost{background:#0b1220;color:var(--txt);border:1px solid var(--line)}
  .row{display:flex;gap:8px}
  #users{max-height:260px;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .u{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1px solid var(--line);background:#0b1220;cursor:pointer;text-align:left;color:var(--txt);width:100%}
  .u.sel{border-color:var(--gold);background:#2a2410}
  .u img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#334155}
  .hint{font-size:12px;color:var(--mut);margin-top:6px}
  #status{font-size:13px;margin-top:8px;min-height:18px}
  .ok{color:var(--ok)}.err{color:var(--err)}
  .hidden{display:none}


  /* บล็อกเคอร์เซอร์กระพริบและการคลุมดำเลือกข้อความทั้งหมด (ยกเว้นช่องกรอก UID) */
body *:not(#user-uid):not(input):not(textarea) {
    -webkit-user-select: none; /* Safari */
    -moz-user-select: none;    /* Firefox */
    -ms-user-select: none;     /* IE/Edge */
    user-select: none;         /* Standard */
    -webkit-touch-callout: none; /* ป้องกันการกดค้างบนมือถือ */
}

  /* ===== กล่องอัปโหลดรูป (ImgBB) ===== */
  #upDrop{border:2px dashed var(--line);border-radius:14px;padding:22px 12px;text-align:center;cursor:pointer;background:#0b1220}
  #upDrop.over{border-color:var(--gold)}
  #upDrop b{display:block;margin-bottom:2px}
  #upDrop span{color:var(--mut);font-size:12px}
  .upItem{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:#0b1220}
  .upHead{display:flex;gap:10px;align-items:center}
  .upHead img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#334155}
  .upName{flex:1;font-size:12px;word-break:break-all}
  .upSt{font-size:12px;color:var(--mut)}
  .upRow{display:flex;gap:6px;margin-top:6px;align-items:center}
  .upRow label{width:62px;flex:none;margin:0}
  .upRow input{flex:1;min-width:0;padding:7px 9px;font-size:12px;border-radius:8px}
  .upRow button{padding:7px 10px;font-size:12px;border-radius:8px;white-space:nowrap}

  .upBox{margin-top:10px}
  .upBox .t{font-size:13px;font-weight:700}
  .upBox .d{font-size:11px;color:var(--mut);margin:1px 0 5px}
  .upTube{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#0b1220;border-radius:999px;padding:4px 4px 4px 12px}
  .upTube input{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;font-size:12px;border-radius:0;outline:0}
  .upTube button{padding:8px 14px;font-size:12px;border-radius:999px;white-space:nowrap;background:#334155;color:var(--txt)}
  .upBox.main .upTube{border-color:var(--gold);background:#2a2410}
  .upBox.main .t{color:var(--gold)}
  .upBox.main .upTube button{background:var(--gold);color:#1e1b0b}
  .upBox.danger .t{color:#fca5a5}

  /* ===== กล่องลบพื้นหลัง ===== */
  #bgPick{border:2px dashed var(--line);border-radius:14px;padding:22px 12px;text-align:center;cursor:pointer;background:#0b1220}
  #bgPick b{display:block;margin-bottom:2px}
  #bgPick span{color:var(--mut);font-size:12px}
  #bgPick.busy{opacity:.5;pointer-events:none}
  #bgBar{height:8px;border-radius:999px;background:#0b1220;border:1px solid var(--line);overflow:hidden;margin-top:10px}
  #bgBar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
  #bgMsg{font-size:12px;color:var(--mut);margin-top:6px;min-height:16px}
  #bgChecker{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background-color:#fff;
    background-image:linear-gradient(45deg,#cbd5e1 25%,transparent 25%,transparent 75%,#cbd5e1 75%),linear-gradient(45deg,#cbd5e1 25%,transparent 25%,transparent 75%,#cbd5e1 75%);
    background-size:20px 20px;background-position:0 0,10px 10px}
  #bgChecker img{display:block;width:100%;max-height:60vh;object-fit:contain}
  #bgActs{display:flex;gap:8px;margin-top:10px}
  #bgActs.hidden{display:none}
  #bgActs button{flex:1;padding:11px 8px;font-size:13px}
  @media (prefers-reduced-motion:reduce){#bgBar i{transition:none}}
</style>
</head>
<body>
<h1>✉️ ส่งข้อความเข้ากล่องจดหมาย</h1>

<!-- ตั้งค่า (กรอกครั้งเดียว เก็บในเครื่องนี้) -->
<div class="card">
  <label>รหัสลับของเว็บผู้ส่ง (api_key ที่ใส่ในตาราง inbox_senders)</label>
  <input id="key" type="password" placeholder="รหัสลับ" autocomplete="off">
  <div class="row" style="margin-top:8px">
    <button class="ghost" style="flex:1" onclick="saveKey()">บันทึกรหัส</button>
  </div>
  <div class="hint">รหัสถูกเก็บไว้ในเครื่องนี้เท่านั้น ไม่ได้เขียนอยู่ในไฟล์</div>
</div>

<!-- เลือกผู้รับ -->
<div class="card">
  <button class="primary" onclick="viewUsers()">👥 ดูรายชื่อ</button>
  <div id="listWrap" class="hidden" style="margin-top:10px">
  <label>เลือกผู้รับ</label>
  <input id="search" placeholder="🔍 ค้นหาชื่อ..." oninput="renderUsers()">
  <div id="users"></div>
  </div>
</div>

<!-- ข้อความ -->
<div id="composer" class="card hidden">
  <label>ส่งถึง: <b id="to" style="color:var(--gold)"></b></label>
  <textarea id="msg" placeholder="พิมพ์ข้อความอะไรก็ได้"></textarea>
  <label style="margin-top:10px">ลิงก์ (ไม่ใส่ก็ได้)</label>
  <input id="link" type="url" placeholder="https://...">
  <div class="hint">ใส่ลิงก์แล้วผู้รับจะเห็นปุ่ม เปิดลิงก์ ถ้าไม่ใส่จะเห็นแค่ปุ่มลบ</div>
  <button class="primary" style="margin-top:10px" id="sendBtn" onclick="send()">ส่งข้อความ</button>
  <div id="status"></div>
  <button class="ghost" style="margin-top:14px;width:100%;color:#fff;background:#b91c1c;border-color:#b91c1c" onclick="banUser()">🚫 แบนผู้ใช้นี้ (ลบทิ้งถาวร)</button>
</div>


<!-- อัปโหลดรูปขึ้น ImgBB แล้วได้ลิงก์ -->
<div class="card" id="upCard">
  <label>🖼️ อัปโหลดรูป → ได้ลิงก์ (ImgBB)</label>
  <div id="upDrop" tabindex="0" role="button" aria-label="เลือกรูป">
    <b>แตะเพื่อเลือกรูป</b>
    <span>เลือกได้หลายรูป ลากมาวาง หรือกด Ctrl+V วางรูปได้</span>
  </div>
  <input id="upFile" type="file" accept="image/*" multiple class="hidden">
  <div id="upList"></div>
  <div class="row hidden" id="upBar" style="margin-top:10px">
    <button class="ghost" style="flex:1" id="upCopyLinks">คัดลอกลิงก์ตรงทั้งหมด</button>
    <button class="ghost" style="flex:1" id="upCopyJson">คัดลอก JSON ทั้งหมด</button>
  </div>
</div>


<!-- ลบพื้นหลังรูป (ทำงานในเครื่อง) -->
<div class="card" id="bgCard">
  <label>✂️ ลบพื้นหลังรูป → PNG โปร่งใส</label>
  <div id="bgPick" tabindex="0" role="button" aria-label="เลือกรูปเพื่อลบพื้นหลัง">
    <b>แตะเพื่อเลือกรูป</b>
    <span>ไม่ต้องตั้งค่าอะไร AI ตัดพื้นหลังให้เอง รูปไม่ถูกส่งไปไหน</span>
  </div>
  <input id="bgFile" type="file" accept="image/*" class="hidden">
  <div id="bgBar" class="hidden"><i></i></div>
  <div id="bgMsg"></div>
  <div id="bgChecker" class="hidden"><img id="bgImg" alt="ผลลัพธ์ลบพื้นหลัง"></div>
  <div id="bgActs" class="hidden">
    <button class="ghost" id="bgDl">⬇️ ดาวน์โหลด PNG โปร่งใส</button>
    <button class="primary" id="bgUp" style="width:auto">☁️ ส่งไป ImgBB</button>
  </div>
  <div id="bgLinks"></div>
</div>

<script>
  // ====== ตั้งค่า ======
  const SUPABASE_URL = 'https://ztkqtvdllpzjsvlqxzni.supabase.co';
  const ANON_KEY = 'sb_publishable_BkDeJmZYwMys8OP4eMkpVQ_F6hrJ35t';
  // =====================

  let users = [];
  let selected = null;

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function getKey(){ try{return localStorage.getItem('inbox_sender_key')||''}catch(e){return ''} }

  async function rpc(fn, body){
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY},
      body: JSON.stringify(body)
    });
    return res.json();
  }

  function setStatus(t, cls){
    const el = document.getElementById('status');
    el.textContent = t; el.className = cls || '';
  }

  function saveKey(){
    const k = document.getElementById('key').value.trim();
    if(!k){ alert('กรอกรหัสลับก่อน'); return; }
    try{ localStorage.setItem('inbox_sender_key', k); }catch(e){}
    alert('บันทึกรหัสแล้ว');
  }

  function viewUsers(){
    const k = document.getElementById('key').value.trim();
    if(k){ try{ localStorage.setItem('inbox_sender_key', k); }catch(e){} }
    if(!getKey()){ alert('กรอกรหัสลับก่อน'); return; }
    document.getElementById('listWrap').classList.remove('hidden');
    loadUsers();
  }

  async function loadUsers(){
    const box = document.getElementById('users');
    box.innerHTML = '<div class="hint">กำลังโหลด...</div>';
    try{
      const r = await rpc('list_inbox_users', { p_api_key: getKey() });
      if(!r || r.ok !== true) throw new Error((r && r.error) || 'โหลดไม่สำเร็จ');
      users = r.users || [];
      renderUsers();
    }catch(err){
      box.innerHTML = '<div class="hint err">โหลดรายชื่อไม่สำเร็จ: '+esc(err.message)+'</div>';
    }
  }

  function renderUsers(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = users.filter(u => !q || String(u.username||'').toLowerCase().includes(q));
    const box = document.getElementById('users');
    if(!list.length){ box.innerHTML = '<div class="hint">ไม่พบผู้ใช้</div>'; return; }
    box.innerHTML = list.map(u =>
      '<button class="u'+(selected===u.username?' sel':'')+'" data-name="'+esc(u.username)+'">' +
      '<img src="'+esc(u.avatar_url||'')+'" onerror="this.style.visibility=\'hidden\'">' +
      '<span>'+esc(u.username)+'</span></button>'
    ).join('');
    box.querySelectorAll('.u').forEach(b => b.onclick = () => pick(b.dataset.name));
  }

  function pick(name){
    selected = name;
    document.getElementById('to').textContent = name;
    document.getElementById('composer').classList.remove('hidden');
    setStatus('');
    renderUsers();
    document.getElementById('msg').focus();
  }

  async function banUser(){
    if(!selected) return;
    if(!confirm('แบน "'+selected+'" ?\nบัญชีจะถูกลบทิ้งถาวร กู้คืนไม่ได้')) return;
    if(!confirm('ยืนยันอีกครั้ง: ลบ "'+selected+'" ออกจากเว็บเลยนะ')) return;
    setStatus('กำลังแบน...');
    try{
      const r = await rpc('ban_user', { p_api_key: getKey(), p_username: selected });
      if(!r || r.ok !== true) throw new Error((r && r.error) || 'แบนไม่สำเร็จ');
      users = users.filter(u => u.username !== selected);
      alert('แบน '+selected+' เรียบร้อย');
      selected = null;
      document.getElementById('composer').classList.add('hidden');
      renderUsers();
    }catch(err){
      setStatus('❌ '+err.message,'err');
    }
  }

  async function send(){
    const text = document.getElementById('msg').value.trim();
    if(!selected){ return; }
    if(!text){ setStatus('พิมพ์ข้อความก่อน','err'); return; }
    let link = document.getElementById('link').value.trim();
    if(!link){ const m = text.match(/https?:\/\/[^\s]+/i); link = m ? m[0] : ''; } // ไม่ได้กรอกช่องลิงก์ แต่แปะลิงก์ในข้อความ -> ใช้ลิงก์นั้น
    const btn = document.getElementById('sendBtn');
    btn.disabled = true; setStatus('กำลังส่ง...');
    try{
      const r = await rpc('send_inbox_message', {
        p_api_key: getKey(), p_username: selected, p_message: text, p_link: link || null
      });
      if(!r || r.ok !== true) throw new Error((r && r.error) || 'ส่งไม่สำเร็จ');
      setStatus('✅ ส่งถึง '+selected+' แล้ว','ok');
      document.getElementById('msg').value = '';
      document.getElementById('link').value = '';
    }catch(err){
      setStatus('❌ '+err.message,'err');
    }finally{ btn.disabled = false; }
  }

  // เริ่มต้น: ถ้ามีรหัสเก็บไว้แล้ว โหลดรายชื่อเลย
  if(getKey()){ document.getElementById('key').value = getKey(); }
</script>

<script>
(function(){
  // ใส่ API key ของ ImgBB ตรงนี้
  const IMGBB_KEY = '607e49c659c03873a42e21b5ec644369';
  const MAX_MB = 32;
  const drop = document.getElementById('upDrop');
  const input = document.getElementById('upFile');
  const list = document.getElementById('upList');
  const bar = document.getElementById('upBar');
  const results = [];

  drop.addEventListener('click', () => input.click());
  drop.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); input.click(); } });
  input.addEventListener('change', () => { handle(input.files); input.value=''; });
  ['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => handle(e.dataTransfer.files));
  document.addEventListener('paste', e => {
    if(document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    const f = [...((e.clipboardData && e.clipboardData.files) || [])].filter(x => x.type.startsWith('image/'));
    if(f.length) handle(f);
  });

  function handle(files){ [...files].filter(f => f.type.startsWith('image/')).forEach(upload); }

  async function copy(text, btn){
    try{ await navigator.clipboard.writeText(text); }
    catch(e){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    if(btn){ const o=btn.textContent; btn.textContent='คัดลอกแล้ว'; setTimeout(()=>btn.textContent=o,1200); }
  }

  function field(title, desc, value, kind){
    const r = document.createElement('div'); r.className = 'upBox' + (kind ? ' '+kind : '');
    r.innerHTML = '<div class="t"></div><div class="d"></div><div class="upTube"><input readonly><button>คัดลอก</button></div>';
    r.querySelector('.t').textContent = title;
    r.querySelector('.d').textContent = desc;
    const i = r.querySelector('input'); i.value = value;
    i.addEventListener('focus', () => i.select());
    const b = r.querySelector('button'); b.addEventListener('click', () => copy(value, b));
    return r;
  }

  async function upload(file){
    const el = document.createElement('div'); el.className='upItem';
    el.innerHTML = '<div class="upHead"><img alt=""><div class="upName"></div><div class="upSt">กำลังอัปโหลด…</div></div>';
    el.querySelector('img').src = URL.createObjectURL(file);
    el.querySelector('.upName').textContent = file.name;
    list.prepend(el);
    const st = el.querySelector('.upSt');

    if(file.size > MAX_MB*1024*1024){ st.textContent='ไฟล์ใหญ่เกิน '+MAX_MB+' MB'; st.className='upSt err'; return; }
    try{
      const fd = new FormData(); fd.append('image', file);
      const res = await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY, {method:'POST', body:fd});
      const json = await res.json();
      if(!res.ok || !json.success) throw new Error((json.error && json.error.message) || 'อัปโหลดไม่สำเร็จ');
      results.push(json);
      const d = json.data;
      st.textContent='สำเร็จ'; st.className='upSt ok';
      const direct = (d.image && d.image.url) || d.url;
      const mainBox = field('ลิงก์ตรงไปหารูป', 'ลงท้ายด้วยนามสกุลไฟล์ เช่น .png .jpg ใช้อันนี้', direct, 'main');
      const useBtn = document.createElement('button'); useBtn.className='ghost'; useBtn.style.cssText='width:100%;margin-top:6px;padding:8px;font-size:12px;border-radius:999px'; useBtn.textContent='ใส่ลิงก์ตรงในช่อง "ลิงก์" ของข้อความ';
      useBtn.addEventListener('click', () => { const l = document.getElementById('link'); if(l){ l.value = direct; useBtn.textContent='ใส่แล้ว'; setTimeout(()=>useBtn.textContent='ใส่ลิงก์ตรงในช่อง "ลิงก์" ของข้อความ',1200); } });
      mainBox.append(useBtn);
      el.append(mainBox);
      if(d.display_url && d.display_url !== direct) el.append(field('ลิงก์แสดงผล', 'ลิงก์ตรงอีกแบบ (ไฟล์ที่ ImgBB ปรับขนาดให้แสดงผล)', d.display_url));
      if(d.medium && d.medium.url) el.append(field('ลิงก์ขนาดกลาง', 'รูปตรงแบบย่อขนาด', d.medium.url));
      if(d.thumb && d.thumb.url) el.append(field('ลิงก์ Thumbnail', 'รูปตรงแบบเล็กมาก', d.thumb.url));
      el.append(field('ลิงก์หน้าเว็บรูป', 'เปิดแล้วเป็นหน้าเว็บ ImgBB ไม่ใช่ไฟล์รูปตรง', d.url_viewer));
      el.append(field('ลิงก์ลบรูป', 'เก็บไว้ ใครกดก็ลบรูปได้', d.delete_url, 'danger'));
      const j = document.createElement('div'); j.className='upBox';
      j.innerHTML = '<button class="ghost" style="width:100%">คัดลอก JSON ทั้งหมดที่ ImgBB ตอบกลับ (รูปนี้)</button>';
      j.querySelector('button').addEventListener('click', e => copy(JSON.stringify(json,null,2), e.target));
      el.append(j);
      bar.classList.remove('hidden');
    }catch(err){
      st.textContent='ล้มเหลว: '+err.message; st.className='upSt err';
    }
  }

  document.getElementById('upCopyLinks').addEventListener('click', e => copy(results.map(r=>(r.data.image&&r.data.image.url)||r.data.url).join('\n'), e.target));
  document.getElementById('upCopyJson').addEventListener('click', e => copy(JSON.stringify(results,null,2), e.target));
})();
</script>

<script type="module">
// ลบพื้นหลังในเครื่อง (ใช้ไลบรารี @imgly/background-removal) แล้วดาวน์โหลดหรือส่งไป ImgBB
const IMGBB_KEY = '607e49c659c03873a42e21b5ec644369'; // คีย์เดียวกับกล่องอัปโหลดด้านบน
const MAX_SIDE = 3000;   // ย่อรูปที่ใหญ่เกินนี้ก่อนประมวลผล กันมือถือค้าง
const MAX_MB = 32;       // ImgBB รับสูงสุด 32 MB
const LIB_URLS = [
  'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm',
  'https://esm.sh/@imgly/background-removal@1.5.8'
];

const $ = id => document.getElementById(id);
const pick = $('bgPick'), file = $('bgFile'), bar = $('bgBar'), barI = bar.querySelector('i');
const msg = $('bgMsg'), checker = $('bgChecker'), img = $('bgImg'), acts = $('bgActs'), links = $('bgLinks');
const dlBtn = $('bgDl'), upBtn = $('bgUp');
let removeFn = null, resultBlob = null, resultUrl = null, baseName = 'image';

const say = (t, cls) => { msg.textContent = t; msg.className = cls || ''; msg.style.color = cls === 'err' ? 'var(--err)' : cls === 'ok' ? 'var(--ok)' : ''; };
const setBar = p => { bar.classList.remove('hidden'); barI.style.width = Math.max(0, Math.min(100, p)) + '%'; };

async function loadLib(){
  if (removeFn) return removeFn;
  let last;
  for (const u of LIB_URLS){
    try {
      const m = await import(u);
      const fn = m.removeBackground || m.default;
      if (typeof fn === 'function'){ removeFn = fn; return fn; }
    } catch (e) { last = e; }
  }
  throw last || new Error('โหลดไลบรารีไม่สำเร็จ');
}

async function shrinkIfBig(f){
  const bmp = await createImageBitmap(f);
  const longest = Math.max(bmp.width, bmp.height);
  if (longest <= MAX_SIDE){ bmp.close && bmp.close(); return f; }
  const k = MAX_SIDE / longest;
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('ย่อรูปไม่สำเร็จ')), 'image/png'));
}

function reset(){
  if (resultUrl){ URL.revokeObjectURL(resultUrl); resultUrl = null; }
  resultBlob = null; img.removeAttribute('src');
  checker.classList.add('hidden'); acts.classList.add('hidden'); links.innerHTML = '';
  setBar(0);
}

async function run(f){
  reset();
  baseName = (f.name || 'image').replace(/\.[^.]+$/, '').replace(/[^\w\-]+/g, '_') || 'image';
  pick.classList.add('busy');
  try {
    say('กำลังโหลดโมเดล (ครั้งแรกอาจนาน หลังจากนั้นเร็วขึ้น)…');
    const fn = await loadLib();
    const src = await shrinkIfBig(f);
    const out = await fn(src, {
      output: { format: 'image/png' },
      progress: (key, cur, total) => {
        if (!total) return;
        const p = Math.round(cur / total * 100);
        setBar(p);
        say(String(key).startsWith('fetch') ? 'กำลังโหลดโมเดล… ' + p + '%' : 'กำลังตัดพื้นหลัง… ' + p + '%');
      }
    });
    resultBlob = out;
    resultUrl = URL.createObjectURL(out);
    img.src = resultUrl;
    checker.classList.remove('hidden'); acts.classList.remove('hidden');
    setBar(100);
    say('เสร็จแล้ว ขนาด ' + (out.size / 1048576).toFixed(2) + ' MB', 'ok');
  } catch (err) {
    say('ล้มเหลว: ' + (err && err.message ? err.message : err), 'err');
    bar.classList.add('hidden');
  } finally {
    pick.classList.remove('busy');
  }
}

pick.addEventListener('click', () => file.click());
pick.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); file.click(); } });
file.addEventListener('change', () => { const f = file.files[0]; file.value = ''; if (f && f.type.startsWith('image/')) run(f); });

dlBtn.addEventListener('click', () => {
  if (!resultBlob) return;
  const a = document.createElement('a');
  a.href = resultUrl; a.download = baseName + '-nobg.png';
  document.body.appendChild(a); a.click(); a.remove();
});

async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  const o = btn.textContent; btn.textContent = 'คัดลอกแล้ว'; setTimeout(() => btn.textContent = o, 1200);
}
function tube(title, desc, value, kind){
  const r = document.createElement('div'); r.className = 'upBox' + (kind ? ' ' + kind : '');
  r.innerHTML = '<div class="t"></div><div class="d"></div><div class="upTube"><input readonly><button>คัดลอก</button></div>';
  r.querySelector('.t').textContent = title; r.querySelector('.d').textContent = desc;
  const i = r.querySelector('input'); i.value = value; i.addEventListener('focus', () => i.select());
  const b = r.querySelector('button'); b.addEventListener('click', () => copy(value, b));
  return r;
}

upBtn.addEventListener('click', async () => {
  if (!resultBlob) return;
  if (resultBlob.size > MAX_MB * 1048576){ say('ไฟล์ใหญ่เกิน ' + MAX_MB + ' MB', 'err'); return; }
  upBtn.disabled = true; const old = upBtn.textContent; upBtn.textContent = 'กำลังส่ง…';
  try {
    const fd = new FormData();
    fd.append('image', resultBlob, baseName + '-nobg.png');
    const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_KEY, { method: 'POST', body: fd });
    const json = await res.json();
    if (!res.ok || !json.success) throw new Error((json.error && json.error.message) || 'อัปโหลดไม่สำเร็จ');
    const d = json.data;
    const direct = (d.image && d.image.url) || d.url;
    links.innerHTML = '';
    links.append(tube('ลิงก์ตรงไปหารูป', 'ลงท้าย .png พื้นหลังโปร่งใส ใช้อันนี้', direct, 'main'));
    links.append(tube('ลิงก์หน้าเว็บรูป', 'เปิดแล้วเป็นหน้าเว็บ ImgBB ไม่ใช่ไฟล์รูปตรง', d.url_viewer));
    links.append(tube('ลิงก์ลบรูป', 'เก็บไว้ ใครกดก็ลบรูปได้', d.delete_url, 'danger'));
    say('ส่งขึ้น ImgBB สำเร็จ', 'ok');
  } catch (err) {
    say('ส่งไป ImgBB ไม่สำเร็จ: ' + (err && err.message ? err.message : err), 'err');
  } finally {
    upBtn.disabled = false; upBtn.textContent = old;
  }
});
</script>
